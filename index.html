<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#184E77"/>
  <title>MarketPulse Analytics — Marketing Campaign Intelligence</title>
  <meta name="description" content="MarketPulse Analytics: Executive live marketing analytics dashboard analyzing 200,000+ campaigns across Google Ads, YouTube, Facebook, Instagram and Email."/>
  
  <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <script>
    try{
      var t=localStorage.getItem('marketpulse-theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)){
        document.documentElement.classList.add('dark');
      }
    }catch(e){
      if(matchMedia('(prefers-color-scheme: dark)').matches){
        document.documentElement.classList.add('dark');
      }
    }
  </script>
</head>
<body class="bg-[#F4FAF6] dark:bg-[#091522] text-[#184E77] dark:text-[#E2EEF7] antialiased min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
